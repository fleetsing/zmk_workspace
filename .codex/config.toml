# Codex project config for the ZMK workspace.
# Loaded on top of ~/.codex/config.toml when this repo is trusted.
# Project rules live in ../AGENTS.md and ../docs/project-context.md, not here.

approval_policy = "on-request"
web_search = "cached"
project_doc_max_bytes = 65536
default_permissions = "zmk-workspace"

# The workspace root and its nested repos are writable, except:
# - zmk/ (pinned upstream reference): read-only, so writes need approval
# - nested repos' .git: read-only, so commits need approval, matching the root .git
#   Add one line per module repo under zmk_modules/; globs only support "deny".
[permissions.zmk-workspace.filesystem]
":root" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"

[permissions.zmk-workspace.filesystem.":workspace_roots"]
"." = "write"
"zmk" = "read"
"zmk_config/.git" = "read"
